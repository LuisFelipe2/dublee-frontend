server {
    listen ${PORT};

    root /usr/share/nginx/html;
    index index.html;

    # Nunca cacheia o HTML — garante que o browser sempre busca a versão mais recente
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Assets com hash no nome podem ser cacheados por longo prazo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
