<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redublador de Vídeos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .header .warning {
            background: #fff3cd;
            color: #856404;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 8px;
            border: 1px solid #ffeaa7;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-number {
            background: #667eea;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .file-input-label:hover,
        .file-input-label.drag-over {
            border-color: #764ba2;
            background: #f0f1ff;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-upload {
            flex: 1;
            background: #667eea;
            color: white;
        }

        .btn-upload:hover:not(:disabled) {
            background: #5568d3;
        }

        .btn-upload:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .btn-record {
            background: #ff9800;
            color: white;
            flex: 1;
        }

        .btn-record:hover:not(:disabled) {
            background: #fb8c00;
        }

        .btn-record:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-stop {
            background: #f44336;
            color: white;
            flex: 1;
        }

        .btn-stop:hover:not(:disabled) {
            background: #da190b;
        }

        .btn-stop:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-cancel {
            background: #757575;
            color: white;
        }

        .btn-cancel:hover {
            background: #616161;
        }

        .status-message {
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }

        .status-message.show {
            display: block;
        }

        .status-message.loading {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }

        .status-message.error {
            background: #ffebee;
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top: 2px solid #1976d2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s ease;
        }

        .hidden {
            display: none;
        }

        .filename-display {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
        }

        .processing-status {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Redublador de Vídeos</h1>
            <p>Importe seu vídeo, grave a dublagem e baixe o resultado</p>
            <div id="microphoneWarning" class="warning" style="display: none;">
                ⚠️ Para gravar áudio, use HTTPS ou um navegador moderno. O acesso ao microfone não está disponível neste ambiente.
            </div>
        </div>

        <div class="content">
            <!-- Step 1: Upload -->
            <div class="section" id="uploadSection">
                <h2>
                    <span class="section-number">1</span>
                    Importe seu vídeo
                </h2>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept="video/*" />
                    <label for="fileInput" class="file-input-label" id="fileLabel">
                        <div style="text-align: center;">
                            <div style="font-size: 32px; margin-bottom: 10px;">📹</div>
                            <div>Clique para selecionar ou arraste seu vídeo aqui</div>
                            <div style="font-size: 12px; color: #999; margin-top: 8px;">MP4, MOV, AVI e outros formatos</div>
                        </div>
                    </label>
                </div>
                <div id="fileName" class="filename-display" style="display: none;"></div>
                <div class="button-group">
                    <button class="btn btn-upload" id="uploadBtn" disabled>Enviar Vídeo</button>
                    <button class="btn btn-reset" id="resetBtn">Limpar</button>
                </div>
                <div id="statusMessage" class="status-message"></div>
            </div>

            <!-- Step 2: Processing & Recording -->
            <div class="section hidden" id="recordingSection">
                <h2>
                    <span class="section-number">2</span>
                    Grave sua dublagem
                </h2>
                
                <div id="processingStatus" class="processing-status">
                    <div style="margin-bottom: 10px;">⚙️ Preparando vídeo...</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <video id="recordingVideo" controls muted style="margin-top: 20px;"></video>

                <div class="button-group">
                    <button class="btn btn-record" id="startRecordBtn">Iniciar Gravação 🎙</button>
                    <button class="btn btn-stop" id="stopRecordBtn" disabled>Parar Gravação</button>
                </div>
                <button class="btn btn-cancel" style="width: 100%; margin-top: 10px;" onclick="resetAll()">Cancelar</button>

                <div id="recordingStatus" class="processing-status" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMessage = document.getElementById('statusMessage');
        const fileLabel = document.getElementById('fileLabel');
        const microphoneWarning = document.getElementById('microphoneWarning');

        // Verificar disponibilidade do microfone ao carregar a página
        window.addEventListener('load', function() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                microphoneWarning.style.display = 'block';
            }
        });

        const uploadSection = document.getElementById('uploadSection');
        const recordingSection = document.getElementById('recordingSection');
        const recordingVideo = document.getElementById('recordingVideo');
        const startRecordBtn = document.getElementById('startRecordBtn');
        const stopRecordBtn = document.getElementById('stopRecordBtn');
        const recordingStatus = document.getElementById('recordingStatus');
        const processingStatus = document.getElementById('processingStatus');
        const progressFill = document.getElementById('progressFill');

        // Add event listener for start recording button
        startRecordBtn.addEventListener('click', startRecording);

        // Add event listener for stop recording button
        stopRecordBtn.addEventListener('click', stopRecording);

        let currentVideoId = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let currentStream = null;
        let statusCheckInterval = null;
        let voiceRemovalComplete = false;
        let isRecordingStart = false;

        // File input handlers
        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.classList.add('drag-over');
        });

        fileLabel.addEventListener('dragleave', () => {
            fileLabel.classList.remove('drag-over');
        });

        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.classList.remove('drag-over');
            fileInput.files = e.dataTransfer.files;
            updateFileDisplay();
        });

        fileInput.addEventListener('change', updateFileDisplay);

        function updateFileDisplay() {
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileName.textContent = `Arquivo: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)`;
                fileName.style.display = 'block';
                uploadBtn.disabled = false;
            } else {
                fileName.style.display = 'none';
                uploadBtn.disabled = true;
            }
        }

        uploadBtn.addEventListener('click', uploadVideo);
        resetBtn.addEventListener('click', resetForm);

        function resetForm() {
            fileInput.value = '';
            fileName.style.display = 'none';
            uploadBtn.disabled = true;
            hideStatus();
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message show ${type}`;
            
            if (type === 'loading') {
                statusMessage.innerHTML = `<span class="spinner"></span>${message}`;
            }
        }

        function hideStatus() {
            statusMessage.className = 'status-message';
        }

        async function uploadVideo() {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            uploadBtn.disabled = true;
            showStatus('Enviando vídeo...', 'loading');

            try {
                const response = await fetch('/api/videos/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    currentVideoId = data.data.id;
                    showStatus('Vídeo enviado! Preparando...', 'loading');
                    
                    // Hide upload, show recording
                    uploadSection.classList.add('hidden');
                    recordingSection.classList.remove('hidden');
                    
                    // Load the video
                    recordingVideo.src = `/api/videos/download/${currentVideoId}`;
                    recordingVideo.load();
                    
                    // Start checking processing status
                    checkVoiceRemovalStatus();
                    statusCheckInterval = setInterval(checkVoiceRemovalStatus, 2000);
                } else {
                    showStatus(data.error || 'Erro ao enviar vídeo', 'error');
                }
            } catch (error) {
                showStatus('Erro ao enviar vídeo: ' + error.message, 'error');
            } finally {
                uploadBtn.disabled = false;
            }
        }

        async function checkVoiceRemovalStatus() {
            if (!currentVideoId || voiceRemovalComplete) return;

            try {
                const response = await fetch(`/api/videos/${currentVideoId}/voice-removal-status`);
                const data = await response.json();

                if (data.success) {
                    const { is_processing, is_complete, error } = data.data;

                    if (error) {
                        showStatus(`Erro no processamento: ${error}`, 'error');
                        clearInterval(statusCheckInterval);
                    } else if (is_complete && !isRecordingStart) {
                        voiceRemovalComplete = true;
                        processingStatus.innerHTML = '✅ Vídeo pronto! Você pode começar a gravar sua dubagem.';
                        recordingStatus.textContent = 'Clique em "Iniciar Gravação" para começar';
                        clearInterval(statusCheckInterval);
                    } else if (is_processing && !isRecordingStart) {
                        // Still processing, update progress
                        progressFill.style.width = '50%';
                        recordingStatus.textContent = 'Processando áudio...';
                    }
                }
            } catch (error) {
                console.error('Erro ao verificar status:', error);
            }
        }

        async function startRecording() {
            // Verificar se a API está disponível
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                recordingStatus.textContent = '❌ Microfone não suportado. Use HTTPS ou um navegador moderno (Chrome, Firefox, Edge).';
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                currentStream = stream;
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.addEventListener('dataavailable', event => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                });

                mediaRecorder.addEventListener('stop', finalizeRecording);
                mediaRecorder.start();

                recordingVideo.currentTime = 0;
                await recordingVideo.play();

                stopRecordBtn.disabled = false;
                recordingStatus.textContent = '🎙 Gravando... Fale em sincronia com o vídeo.';
                isRecordingStart = true;
            } catch (error) {
                let errorMessage = 'Erro ao acessar microfone: ';
                
                if (error.name === 'NotAllowedError') {
                    errorMessage += 'Permissão negada. Permita acesso ao microfone.';
                } else if (error.name === 'NotFoundError') {
                    errorMessage += 'Microfone não encontrado.';
                } else if (error.name === 'NotReadableError') {
                    errorMessage += 'Microfone está sendo usado por outro aplicativo.';
                } else if (error.name === 'OverconstrainedError') {
                    errorMessage += 'Configuração de áudio não suportada.';
                } else if (error.name === 'SecurityError') {
                    errorMessage += 'Acesso negado. Use HTTPS para acessar o microfone.';
                } else {
                    errorMessage += error.message;
                }
                
                recordingStatus.textContent = errorMessage;
                startRecordBtn.disabled = false;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }

            recordingVideo.pause();
            stopRecordBtn.disabled = true;
            recordingStatus.textContent = 'Processando áudio gravado...';
        }

        async function finalizeRecording() {
            if (recordedChunks.length === 0) {
                recordingStatus.textContent = 'Nenhum áudio gravado.';
                startRecordBtn.disabled = false;
                return;
            }

            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            const formData = new FormData();
            formData.append('audio', blob, 'recorded_audio.webm');

            recordingStatus.textContent = 'Renderizando vídeo final...';
            startRecordBtn.disabled = true;

            try {
                const response = await fetch(`/api/videos/${currentVideoId}/record-audio`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || data.message || 'Erro ao processar áudio');
                }

                const videoBlob = await response.blob();
                const downloadUrl = URL.createObjectURL(videoBlob);
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = `video-redublado-${new Date().getTime()}.mp4`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(downloadUrl);

                recordingStatus.textContent = '✅ Download iniciado! Seu vídeo redublado está pronto.';
            } catch (error) {
                recordingStatus.textContent = 'Erro ao processar: ' + error.message;
                startRecordBtn.disabled = false;
            }
        }

        function resetAll() {
            if (statusCheckInterval) clearInterval(statusCheckInterval);
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            
            recordingSection.classList.add('hidden');
            uploadSection.classList.remove('hidden');
            resetForm();
            
            currentVideoId = null;
            voiceRemovalComplete = false;
            recordingVideo.src = '';
            recordedChunks = [];
            startRecordBtn.disabled = false;
            stopRecordBtn.disabled = true;
        }
    </script>
</body>
</html>
